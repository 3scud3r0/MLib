[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-mathlib"
version = "0.6.0.dev0"
description = "Experimental exact mathematics and computational certificates over rational domains"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
ml-mathlib = "ml_mathlib:main"
mlib-replay = "replay_certificate:main"

[tool.setuptools]
py-modules = ["ml_mathlib", "ml_mathlib_advanced", "ml_mathlib_exact", "ml_mathlib_verified", "ml_mathlib_foundations", "ml_mathlib_linear", "replay_certificate"]
