name: Rust exact kernel & FFI verification
on:
  push:
    paths:
      - 'mlib-core/**'
      - '.github/workflows/rust-kernel.yml'
  pull_request:
    paths:
      - 'mlib-core/**'
      - '.github/workflows/rust-kernel.yml'
  workflow_dispatch:
jobs:
  rust-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
      - name: Test trusted kernel without Python
        run: cargo test --manifest-path mlib-core/Cargo.toml --all-targets --no-default-features
      - name: Audit compile-fail proof constructor (Rust doctests)
        run: cargo test --manifest-path mlib-core/Cargo.toml --doc --no-default-features
      - name: Test optional PyO3 feature
        run: cargo test --manifest-path mlib-core/Cargo.toml --all-targets --features python
      - name: Static Python DSL tests (without Rust module installed)
        run: PYTHONPATH=mlib-core/python python -m unittest discover -s mlib-core/python/tests -v
      - name: Compile and import Python extension
        run: |
          python -m pip install maturin
          cd mlib-core
          maturin build --release --features python --out dist
          python -m pip install dist/*.whl
          python -m unittest discover -s python/tests -v
          python ../examples/nabla_verified_discovery.py
          python - <<'PY'
          import json
          from mlib_core import MlibKernelContext
          c=MlibKernelContext()
          q=json.dumps({"op":"var","index":0})
          p=json.dumps({"op":"var","index":1})
          h=json.dumps({"op":"add","left":{"op":"pow","base":{"op":"var","index":0},"exponent":2},"right":{"op":"pow","base":{"op":"var","index":1},"exponent":2}})
          cert=c.verify_noether(1,h,h)
          assert len(cert.digest)==64
          try:
              c.verify_noether(1,h,q)
          except ValueError:
              pass
          else:
              raise AssertionError("False invariant accepted")
          print("Rust Python FFI: valid theorem accepted, forged invariant rejected")
          PY
